name: Historique 5 min de l'or

on:
  workflow_dispatch:
  push:
    paths: ["scripts/fetch_histo.py"]
  schedule:
    - cron: "15 */2 * * *"   # toutes les 2 h jusqu'à complétion : complète les jours manquants

permissions:
  contents: write

jobs:
  histo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger l'historique (reprend là où il s'est arrêté)
        continue-on-error: true
        run: python scripts/fetch_histo.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/histo
          git diff --cached --quiet || git commit -m "Historique 5 min de l'or"
          git pull --rebase origin main
          git push
