name: Bilan or

on:
  schedule:
    - cron: "5 */3 * * *"   # complète l'historique 5 min (temporaire, jusqu'à complétion)
    - cron: "30 6 * * 1-5"   # 06h30 UTC = 07h30 à Paris en hiver (08h30 en été) ; GitHub peut retarder l'exécution
  push:
    paths: ["scripts/fetch_ohlc.py", "scripts/fetch_facteurs.py", "scripts/modele_facteurs.py", "scripts/fetch_histo.py"]   # se relance quand ce script change
  workflow_dispatch:          # lancement manuel : onglet Actions > Bilan or > Run workflow

permissions:
  contents: write

jobs:
  bilan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du code
        run: python -m unittest discover -s tests -v
      - name: Récupérer l'historique de l'or
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/fetch_or.py
      - name: Récupérer l'or détaillé (ouverture, plus haut, plus bas, heures)
        continue-on-error: true
        run: python scripts/fetch_ohlc.py
      - name: Récupérer les facteurs et le calendrier des annonces
        continue-on-error: true
        run: python scripts/fetch_facteurs.py
      - name: Prédiction du modèle multi-facteurs (journal pour test en conditions réelles)
        continue-on-error: true
        run: |
          pip install --quiet pandas numpy scikit-learn
          python scripts/modele_facteurs.py --journal
      - name: Historique 5 min de l'or (par lots, reprend où il s'est arrêté)
        continue-on-error: true
        timeout-minutes: 50
        run: python scripts/fetch_histo.py
      - name: Calculer les signaux
        run: python scripts/signaux_or.py
      - name: Enregistrer le rapport
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data rapports journal
          git diff --cached --quiet || git commit -m "Bilan automatique"
          git pull --rebase origin main
          git push
