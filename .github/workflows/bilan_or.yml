name: Bilan or

on:
  schedule:
    - cron: "30 6 * * 1-5"   # 06h30 UTC = 07h30 à Paris en hiver (08h30 en été) ; GitHub peut retarder l'exécution
  push:
    paths: ["scripts/**", ".github/workflows/bilan_or.yml"]   # se relance quand le code change
  workflow_dispatch:          # lancement manuel : onglet Actions > Bilan or > Run workflow
    inputs:
      mode:
        description: "histo = seulement le téléchargement de l'historique 5 min"
        required: false
        default: "tout"

permissions:
  contents: write
  actions: write

concurrency:
  group: bilan-or
  cancel-in-progress: ${{ github.event_name == 'push' }}   # un nouveau push remplace l'exécution en cours ; la boucle de téléchargement n'est jamais interrompue

jobs:
  bilan:
    if: ${{ inputs.mode != 'histo' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du code
        run: python -m unittest discover -s tests -v
      - name: Historique quotidien de l'or (Alpha Vantage)
        id: av
        continue-on-error: true
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/donnees/fetch_or.py
      - name: Or détaillé (ouverture, plus haut, plus bas, heures)
        continue-on-error: true
        run: python scripts/donnees/fetch_ohlc.py
      - name: Facteurs et calendrier des annonces
        continue-on-error: true
        run: python scripts/donnees/fetch_facteurs.py
      - name: Prédiction du modèle multi-facteurs (journal pour test en conditions réelles)
        continue-on-error: true
        run: |
          pip install --quiet pandas numpy scikit-learn
          python scripts/quotidien/modele_facteurs.py --journal
      - name: Signaux du jour
        id: signaux
        continue-on-error: true
        run: python scripts/quotidien/signaux_or.py
      - name: Diagnostic (lisible dans le dépôt)
        if: always()
        run: |
          echo "$(date -u +%FT%TZ) alphavantage=${{ steps.av.outcome }} signaux=${{ steps.signaux.outcome }}" >> data/diagnostic_actions.txt
          tail -n 30 data/diagnostic_actions.txt > data/d.tmp && mv data/d.tmp data/diagnostic_actions.txt
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git restore resultats 2>/dev/null || true
          git add data rapports journal
          git diff --cached --quiet || git commit -m "Bilan automatique"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break; sleep 8; done

  histo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Historique 5 min de l'or (par lots, reprend où il s'est arrêté)
        continue-on-error: true
        timeout-minutes: 40
        run: python scripts/donnees/fetch_histo.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/histo
          git diff --cached --quiet || git commit -m "Historique 5 min de l'or"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break; sleep 8; done
      - name: Relancer tant qu'il reste des jours à télécharger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reste=$(cat data/histo/reste.txt 2>/dev/null || echo 0)
          ajoutes=$(cat data/histo/ajoutes.txt 2>/dev/null || echo 0)
          echo "reste=$reste ajoutes=$ajoutes"
          if [ "$reste" -gt 0 ] && [ "$ajoutes" -gt 0 ]; then gh workflow run bilan_or.yml; fi
